# Local development and e2e database. Never point local development or tests
# at the deployed (Supabase) database: they create and delete rows freely.
#
#   docker compose up -d        # start (data persists in the named volume)
#   docker compose down         # stop
#   docker compose down -v      # stop and wipe all local data
#
# Backend/.env.example shows the matching DATABASE_URL. Postgres 17 matches
# the Supabase production major version.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: fitness_dev
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d fitness_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
